[package]
name = "cef-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Out-of-process CEF browser host (cef_host.exe) for client.dll"

[[bin]]
name = "cef_host"
path = "src/main.rs"

[dependencies]
cef = { path = "../cef" }
cef-sys = { path = "../cef-sys" }
cef-ipc = { path = "../cef-ipc" }
log = "0.4.29"
simplelog = "0.12.2"
parking_lot = "0.12.5"
percent-encoding = "2.3.2"
url = "2.5.7"
winapi = { version = "0.3.9", features = ["libloaderapi", "winuser", "processthreadsapi", "synchapi", "winbase", "handleapi", "timeapi", "winnt", "minwindef"] }
